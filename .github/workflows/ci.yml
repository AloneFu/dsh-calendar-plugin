name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 回归（node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 版本信息
        run: node --version && npm --version

      # 5 套回归（不需要浏览器、不需要 Obsidian）：解析/写回 127 · 展示/时间轴 123 · 向导 38 · 自动展开 16 · 面板高度 13
      - name: 回归测试
        run: npm test

      - name: 页面体积与编码守卫（外部硬约束 + 自加防膨胀）
        run: |
          node -e "
          const fs = require('fs');
          const buf = fs.readFileSync('standalone/calendar.html');
          // 外部硬约束（交付 gate 的切法）：整篇、以及文件头 64KB 切片，都必须是合法 UTF-8。
          // 这条一字不可放宽 —— 头部 64KB 一旦切在半个多字节字符上，gate 就会拒收。
          new TextDecoder('utf-8', { fatal: true }).decode(buf);
          new TextDecoder('utf-8', { fatal: true }).decode(buf.subarray(0, 65536));
          // 自加余量：只是防膨胀，不是外部要求。加第二、第三套皮肤后从 64KiB 放宽到 90KiB。
          const CEILING = 92160;
          if (buf.length >= CEILING) { console.error('页面 ' + buf.length + ' B >= ' + CEILING + '（自加上限），先跑 scripts/slim-page.mjs'); process.exit(1); }
          console.log('页面 ' + buf.length + ' B < ' + CEILING + '（自加），头 64KB 切片与整篇均为合法 UTF-8');
          "

      - name: 打包（npm pack）
        run: node scripts/pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-calendar-tgz-node${{ matrix.node }}
          path: dist/*.tgz
          if-no-files-found: error
